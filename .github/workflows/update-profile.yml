name: Update Kouzi profile

on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.config.json
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml

permissions:
  contents: read

concurrency:
  group: kouzi-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check growth and repository selection
        run: python3 -m unittest discover -s tests -v
      - name: Read public repositories and contribution totals
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py
      - name: Commit generated assets only when changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets data
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update Kouzi and project shelf [skip ci]'
            git push origin HEAD:main
          fi
